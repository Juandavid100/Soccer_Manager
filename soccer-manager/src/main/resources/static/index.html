<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Soccer Manager · Gestión de la escuela de fútbol</title>
  <meta name="description" content="Plataforma para administrar estudiantes, grupos, actividades, evaluaciones y mensualidades de una escuela de fútbol.">
  <link rel="icon" type="image/png" href="img/icono.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="raiz"></div>
  <div class="avisos" id="avisos" aria-live="polite"></div>
  <script>try { document.documentElement.dataset.tema = localStorage.getItem("soccermanager.tema") || "noche"; if (!["noche","cancha","clasico"].includes(document.documentElement.dataset.tema)) document.documentElement.dataset.tema = "noche"; } catch (e) { document.documentElement.dataset.tema = "noche"; }</script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
