spring.application.name=soccermanager
server.port=${PORT:8080}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/soccermanager}
spring.jackson.serialization.write-dates-as-timestamps=false

# La interfaz web siempre se descarga actualizada (evita ver una versión vieja guardada en el navegador)
spring.web.resources.cache.cachecontrol.no-cache=true
